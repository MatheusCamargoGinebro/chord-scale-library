<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chord & Scale Library — Biblioteca avançada de acordes, escalas, modos, arpejos, progressões, composição e estudo para violão e guitarra.">
  <meta name="theme-color" content="#090d16">
  <title>Chord &amp; Scale Library — Estúdio de Violão &amp; Guitarra</title>

  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="manifest" href="./manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/variables.css?v=6">
  <link rel="stylesheet" href="./css/layout.css?v=6">
  <link rel="stylesheet" href="./css/components.css?v=6">
  <link rel="stylesheet" href="./css/modules.css?v=6">
</head>
<body>
  <div class="app-shell">
    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- Sidebar Navigation -->
    <aside id="app-sidebar" class="sidebar" aria-label="Navegação principal">
      <div class="brand-header">
        <img src="./icons/icon.svg" alt="" class="brand-logo" width="34" height="34">
        <div>
          <h1 class="brand-name">Chord &amp; Scale</h1>
          <span class="brand-sub">LIBRARY PRO</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav-list">
        <span class="nav-group-label">Explorar</span>
        <button class="nav-item active" data-nav="chords" data-icon="guitar">
          <span class="nav-ico"></span>
          <span>Acordes</span>
        </button>
        <button class="nav-item" data-nav="scales" data-icon="scales">
          <span class="nav-ico"></span>
          <span>Escalas</span>
        </button>
        <button class="nav-item" data-nav="fretboard" data-icon="fretboard">
          <span class="nav-ico"></span>
          <span>Braço 24 Casas</span>
        </button>
        <button class="nav-item" data-nav="arpeggios" data-icon="arpeggios">
          <span class="nav-ico"></span>
          <span>Arpejos</span>
        </button>

        <span class="nav-group-label">Teoria &amp; Harmonia</span>
        <button class="nav-item" data-nav="progressions" data-icon="progressions">
          <span class="nav-ico"></span>
          <span>Progressões &amp; IA</span>
        </button>
        <button class="nav-item" data-nav="modes" data-icon="modes">
          <span class="nav-ico"></span>
          <span>Modos Gregos</span>
        </button>
        <button class="nav-item" data-nav="comparator" data-icon="compare">
          <span class="nav-ico"></span>
          <span>Comparador</span>
        </button>

        <span class="nav-group-label">Prática &amp; Estúdio</span>
        <button class="nav-item" data-nav="composer" data-icon="composer">
          <span class="nav-ico"></span>
          <span>Compositor</span>
        </button>
        <button class="nav-item" data-nav="trainer" data-icon="trainer">
          <span class="nav-ico"></span>
          <span>Treinador Quiz</span>
        </button>
        <button class="nav-item" data-nav="favorites" data-icon="favorites">
          <span class="nav-ico"></span>
          <span>Favoritos</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-tip">
          Pressione <kbd class="kbd-chip">Ctrl+K</kbd> para buscar qualquer acorde, escala ou progressão instantaneamente.
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <div class="main-area">
      <!-- Clean Top Control Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="btn-mobile-menu" class="btn btn-ghost btn-icon mobile-only" aria-label="Abrir menu"></button>
          <button id="btn-global-search" class="btn btn-ghost btn-sm search-trigger-btn" title="Busca Global (Ctrl+K)"></button>
          <div class="topbar-control">
            <label for="global-tuning" class="topbar-label">Afinação</label>
            <select id="global-tuning" class="select-control select-sm" aria-label="Selecionar afinação"></select>
          </div>
          <div class="topbar-control">
            <label for="global-tone" class="topbar-label">Timbre</label>
            <select id="global-tone" class="select-control select-sm" aria-label="Selecionar timbre da guitarra">
              <option value="acoustic">Violão Aço</option>
              <option value="clean">Guitarra Clean</option>
              <option value="jazz">Jazz Hollow</option>
              <option value="overdrive">Rock Crunch</option>
            </select>
          </div>
          <span id="offline-badge" class="badge badge-gold" hidden>Offline</span>
        </div>

        <div class="topbar-right">
          <button id="btn-tuner-open" class="btn btn-ghost btn-sm" title="Afinador Cromático"></button>
          <button id="btn-studio-toggle" class="btn btn-secondary btn-sm"></button>
          <button id="btn-lefthanded" class="btn btn-ghost btn-icon" title="Alternar Modo Canhoto (espelhar braço e diagramas)" aria-label="Modo Canhoto"></button>
          <button id="btn-mute" class="btn btn-ghost btn-icon" title="Silenciar ou ativar áudio" aria-label="Silenciar áudio"></button>
          <button id="btn-share-link" class="btn btn-ghost btn-icon" title="Compartilhar link" aria-label="Compartilhar link"></button>
          <button id="btn-theme-toggle" class="btn btn-ghost btn-icon" title="Alternar tema claro/escuro" aria-label="Alternar tema"></button>
          <button id="btn-pwa-install" class="btn btn-primary btn-sm" hidden></button>
        </div>
      </header>

      <!-- Active Module Stage -->
      <main id="module-stage" class="module-stage" aria-live="polite">
        <div class="card empty-state">
          <h3>Carregando biblioteca musical...</h3>
        </div>
      </main>
    </div>
  </div>

  <!-- Mobile Fixed Bottom Navigation Bar -->
  <nav id="mobile-bottom-nav" class="mobile-bottom-nav" aria-label="Atalhos rápidos">
    <button class="mbn-item active" data-nav="chords" data-icon="guitar"><span class="mbn-ico"></span><span>Acordes</span></button>
    <button class="mbn-item" data-nav="scales" data-icon="scales"><span class="mbn-ico"></span><span>Escalas</span></button>
    <button class="mbn-item" data-nav="fretboard" data-icon="fretboard"><span class="mbn-ico"></span><span>Braço</span></button>
    <button class="mbn-item" data-nav="progressions" data-icon="progressions"><span class="mbn-ico"></span><span>Progr.</span></button>
    <button class="mbn-item" data-nav="composer" data-icon="composer"><span class="mbn-ico"></span><span>Compor</span></button>
    <button id="mbn-more-btn" class="mbn-item" data-icon="menu"><span class="mbn-ico"></span><span>Mais</span></button>
  </nav>

  <!-- Collapsible Studio Rhythm Dock (Metronome + 16-Step Drum Machine) -->
  <aside id="studio-dock" class="studio-dock" aria-label="Metrônomo e Bateria Eletrônica">
    <div class="studio-dock-inner">
      <div class="studio-head">
        <div class="studio-head-left">
          <strong id="studio-dock-title" class="icon-label">Estúdio de Ritmo</strong>
          <div id="beat-leds" class="beat-leds" aria-hidden="true">
            <span class="beat-led accent"></span>
            <span class="beat-led"></span>
            <span class="beat-led"></span>
            <span class="beat-led"></span>
          </div>
        </div>
        <div class="studio-controls">
          <button id="studio-metro-btn" class="btn btn-ghost btn-sm"></button>
          <button id="studio-drum-btn" class="btn btn-ghost btn-sm"></button>
          <button id="studio-stop-btn" class="btn btn-ghost btn-sm"></button>
          <div class="bpm-box">
            <input type="range" id="studio-bpm-range" min="40" max="220" value="104" aria-label="BPM">
            <span id="studio-bpm-val" class="mono-text">104 BPM</span>
          </div>
          <button id="studio-tap-btn" class="btn btn-secondary btn-xs">Tap Tempo</button>
          <select id="studio-drum-preset" class="select-control select-xs" aria-label="Ritmo da bateria"></select>
          <button id="btn-close-studio" class="btn btn-ghost btn-icon-sm" aria-label="Fechar painel"></button>
        </div>
      </div>
      <div id="drum-sequencer-grid" class="drum-sequencer-grid"></div>
    </div>
  </aside>

  <!-- Toast Notification Host -->
  <div id="toast-host" class="toast-host" aria-live="polite"></div>

  <script type="module" src="./js/app.js?v=6"></script>
</body>
</html>
